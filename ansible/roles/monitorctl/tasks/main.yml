---
- name: Check this looks like a Debian-family system
  ansible.builtin.assert:
    that: ansible_facts.os_family == "Debian"
    fail_msg: >-
      This role installs packages with apt and expects Raspberry Pi OS or
      Debian. Detected {{ ansible_facts.os_family }}.
    quiet: true

- name: Install packages
  ansible.builtin.apt:
    name: "{{ monitorctl_packages + (['python3-paho-mqtt'] if monitorctl_mqtt_enabled else []) }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

# Without i2c_dev there are no /dev/i2c-* nodes at all and nothing works.
# /etc/modules still functions but is deprecated on Debian 13; the file says so
# itself. modules-load.d is the supported home.
- name: Load i2c_dev on boot
  ansible.builtin.copy:
    content: "i2c_dev\n"
    dest: /etc/modules-load.d/i2c-dev.conf
    owner: root
    group: root
    mode: "0644"
  become: true

# Loading it now as well, so the first run does not need a reboot to work.
# community.general.modprobe would be tidier, but this role deliberately sticks
# to ansible.builtin so nobody has to install collections first.
- name: Check whether i2c_dev is already loaded
  ansible.builtin.command: lsmod
  changed_when: false
  register: monitorctl_lsmod

- name: Load i2c_dev now
  ansible.builtin.command: modprobe i2c_dev
  become: true
  when: "'i2c_dev' not in monitorctl_lsmod.stdout"
  changed_when: true

- name: Ensure the i2c group exists
  ansible.builtin.group:
    name: i2c
    system: true
    state: present
  become: true

- name: Create the service group
  ansible.builtin.group:
    name: "{{ monitorctl_group }}"
    system: true
    state: present
  become: true

# Membership in i2c is what lets the service run unprivileged. Verified: no
# root is needed for any ddcutil operation this project performs.
- name: Create the service user
  ansible.builtin.user:
    name: "{{ monitorctl_user }}"
    group: "{{ monitorctl_group }}"
    groups: i2c
    append: true
    system: true
    create_home: false
    home: "{{ monitorctl_install_dir }}"
    shell: /usr/sbin/nologin
    state: present
  become: true

- name: Create directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  become: true
  loop:
    - { path: "{{ monitorctl_install_dir }}", mode: "0755" }
    - { path: "{{ monitorctl_config_dir }}", mode: "0750", group: "{{ monitorctl_group }}" }

- name: Deploy the service
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../service/"
    dest: "{{ monitorctl_install_dir }}/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
  become: true
  notify: Restart monitorctl

- name: Write the configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ monitorctl_config_dir }}/config.yaml"
    owner: root
    group: "{{ monitorctl_group }}"
    mode: "0640"
  become: true
  notify: Restart monitorctl

# Credentials live apart from the config so the config can be read freely and
# quoted in bug reports without leaking anything.
- name: Write credentials
  ansible.builtin.template:
    src: env.j2
    dest: "{{ monitorctl_config_dir }}/env"
    owner: root
    group: "{{ monitorctl_group }}"
    mode: "0640"
  become: true
  no_log: true
  notify: Restart monitorctl

- name: Install the systemd unit
  ansible.builtin.template:
    src: monitorctl.service.j2
    dest: /etc/systemd/system/monitorctl.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd
    - Restart monitorctl

- name: Force a video mode on the kernel command line
  when: monitorctl_force_video
  become: true
  block:
    - name: Read the current kernel command line
      ansible.builtin.slurp:
        src: "{{ monitorctl_cmdline_path }}"
      register: monitorctl_cmdline_raw

    - name: Add the video= parameter
      ansible.builtin.copy:
        # cmdline.txt is a single line; a newline anywhere in it silently
        # truncates the parameters the bootloader passes on.
        content: >-
          {{ (monitorctl_cmdline_raw.content | b64decode | trim
              ~ ' video=' ~ monitorctl_video_mode) | trim }}
        dest: "{{ monitorctl_cmdline_path }}"
        owner: root
        group: root
        mode: "0755"
        backup: true
      when: >-
        'video=' ~ monitorctl_video_mode
        not in (monitorctl_cmdline_raw.content | b64decode)
      notify: Reboot for the video mode

- name: Enable and start monitorctl
  ansible.builtin.systemd_service:
    name: monitorctl
    enabled: true
    state: started
    daemon_reload: true
  become: true

# Handlers have to run before the health check, or it would test the old build.
- name: Apply pending restarts before verifying
  ansible.builtin.meta: flush_handlers

- name: Wait for the service to answer
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ monitorctl_bind_port }}/healthz"
    return_content: true
  register: monitorctl_health
  # Startup reads the capabilities string, which is slow and occasionally needs
  # a retry. A monitor that is merely switched off will never answer, and this
  # is the point at which that should be reported rather than silently ignored.
  retries: 20
  delay: 5
  until: monitorctl_health.status is defined and monitorctl_health.status == 200
  changed_when: false

- name: Report what was detected
  ansible.builtin.debug:
    msg: >-
      monitorctl {{ (monitorctl_health.content | from_json).version }} is up on
      bus {{ (monitorctl_health.content | from_json).bus }} using profile
      "{{ (monitorctl_health.content | from_json).profile }}" with
      {{ (monitorctl_health.content | from_json).features }} features.
